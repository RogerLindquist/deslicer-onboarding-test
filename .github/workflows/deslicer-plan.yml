# Deslicer CI — GitHub Actions (token path, no GitHub App)
# Per-tenant secrets live on a GitHub Environment named after the tenant slug
# (YAML stem). Optional workflow_dispatch input limits discovery to one stem;
# when omitted, every file under .deslicer/environments/ is scanned.
# Path A2 (#989): pull_request → validate/diff only; push to main/master
# (merge) or workflow_dispatch → create/reconcile plan.

name: Deslicer plan

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment name (tenant slug)
        required: false
        type: string

permissions:
  contents: read

jobs:
  list-environments:
    runs-on: ubuntu-latest
    outputs:
      stems: ${{ steps.environments.outputs.targets }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # tag v5
        with:
          lfs: true
      - name: Install deslicer
        run: |
          set -euo pipefail
          export DESLICER_INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "${DESLICER_INSTALL_DIR}"
          INSTALL_SH="$(umask 077; mktemp)"
          trap 'rm -f "${INSTALL_SH}"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/deslicer/cli/v1.3.2/scripts/install.sh" -o "${INSTALL_SH}"
          echo "192979999546782cb495bb679fd6548942ec94326a5915766246c01873740a15  ${INSTALL_SH}" | sha256sum -c -
          rm -f "${DESLICER_INSTALL_DIR}/deslicer"
          DESLICER_VERSION="v1.3.2" bash "${INSTALL_SH}" || test -x "${DESLICER_INSTALL_DIR}/deslicer"
          "${DESLICER_INSTALL_DIR}/deslicer" --version | grep -F "1.3.2"
          echo "${DESLICER_INSTALL_DIR}" >> "${GITHUB_PATH}"
      - id: environments
        name: List environments
        env:
          PIN: ${{ github.event.inputs.environment }}
        run: |
          chmod +x .github/scripts/discover-deslicer-environments.sh
          .github/scripts/discover-deslicer-environments.sh

  discover-inventory:
    needs: list-environments
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.list-environments.outputs.stems) }}
    environment: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # tag v5
        with:
          lfs: true
      - name: Discover inventory for ${{ matrix.environment }}
        env:
          PIN: ${{ matrix.environment }}
          MATRIX_OUTPUT_PATH: matrix.json
          OBSERVER_API_URL: ${{ vars.OBSERVER_API_URL }}
          DESLICER_API_TOKEN: ${{ secrets.DESLICER_API_TOKEN }}
        run: |
          chmod +x .github/scripts/discover-plan-matrix.sh
          .github/scripts/discover-plan-matrix.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plan-matrix-${{ matrix.environment }}
          path: matrix.json
          if-no-files-found: error

  assemble-plan-matrix:
    needs: [list-environments, discover-inventory]
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.merge.outputs.matrix }}
      has_targets: ${{ steps.merge.outputs.has_targets }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # tag v5
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: plan-matrix-*
          merge-multiple: true
          path: matrices
      - id: merge
        name: Assemble plan matrix
        run: |
          chmod +x .github/scripts/merge-plan-matrix.sh
          .github/scripts/merge-plan-matrix.sh matrices

  # PR sync: env YAML + inventory validate only — never create pending_approval plans.
  validate-diff:
    needs: list-environments
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJson(needs.list-environments.outputs.stems) }}
    environment: ${{ matrix.environment }}
    env:
      OBSERVER_API_URL: ${{ vars.OBSERVER_API_URL }}
      DESLICER_API_TOKEN: ${{ secrets.DESLICER_API_TOKEN }}
      DESLICER_ENVIRONMENT: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # tag v5
        with:
          lfs: true
      - name: Install deslicer
        run: |
          set -euo pipefail
          export DESLICER_INSTALL_DIR="${HOME}/.local/bin"
          mkdir -p "${DESLICER_INSTALL_DIR}"
          INSTALL_SH="$(umask 077; mktemp)"
          trap 'rm -f "${INSTALL_SH}"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/deslicer/cli/v1.3.2/scripts/install.sh" -o "${INSTALL_SH}"
          echo "192979999546782cb495bb679fd6548942ec94326a5915766246c01873740a15  ${INSTALL_SH}" | sha256sum -c -
          rm -f "${DESLICER_INSTALL_DIR}/deslicer"
          DESLICER_VERSION="v1.3.2" bash "${INSTALL_SH}" || test -x "${DESLICER_INSTALL_DIR}/deslicer"
          "${DESLICER_INSTALL_DIR}/deslicer" --version | grep -F "1.3.2"
          echo "${DESLICER_INSTALL_DIR}" >> "${GITHUB_PATH}"
      - name: Preflight Observer configuration
        run: |
          set -euo pipefail
          if [[ -z "${OBSERVER_API_URL}" ]]; then
            echo "::error::Set GitHub Environment variable OBSERVER_API_URL"
            exit 1
          fi
          if [[ -z "${DESLICER_API_TOKEN}" ]]; then
            echo "::error::Set GitHub Environment secret DESLICER_API_TOKEN (tools-scope Observer API key)"
            exit 1
          fi
          if [[ -z "${DESLICER_ENVIRONMENT}" ]]; then
            echo "::error::Missing matrix environment stem"
            exit 1
          fi
      - name: Validate environment ${{ matrix.environment }}
        run: |
          set -euo pipefail
          deslicer inventory validate --environment "${DESLICER_ENVIRONMENT}"
          {
            echo '## Diff check (pull request)'
            echo ""
            echo "Validated \`${DESLICER_ENVIRONMENT}\` without creating a plan."
            echo "Merge to \`main\`/\`master\` to create or reconcile the change plan at HEAD."
          } >> "${GITHUB_STEP_SUMMARY}"

  create-plan:
    needs: assemble-plan-matrix
    if: >-
      needs.assemble-plan-matrix.outputs.has_targets == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.assemble-plan-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    concurrency:
      group: deslicer-plan-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.environment }}-${{ matrix.inventory_group }}
      cancel-in-progress: true
    environment: ${{ matrix.environment }}
    env:
      OBSERVER_API_URL: ${{ vars.OBSERVER_API_URL }}
      DESLICER_API_TOKEN: ${{ secrets.DESLICER_API_TOKEN }}
      DESLICER_ENVIRONMENT: ${{ matrix.environment }}
      INVENTORY_GROUP: ${{ matrix.inventory_group }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Preflight Observer configuration
        run: |
          set -euo pipefail
          if [[ -z "${OBSERVER_API_URL}" ]]; then
            echo "::error::Set GitHub Environment variable OBSERVER_API_URL"
            exit 1
          fi
          if [[ -z "${DESLICER_API_TOKEN}" ]]; then
            echo "::error::Set GitHub Environment secret DESLICER_API_TOKEN (tools-scope Observer API key)"
            exit 1
          fi
          if [[ -z "${INVENTORY_GROUP}" ]]; then
            echo "::error::Missing matrix inventory_group"
            exit 1
          fi
          # change-action whitespace-splits command-args; UUID matrix output could
          # not inject flags — names must be allowlisted before interpolation.
          if [[ ! "${INVENTORY_GROUP}" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid matrix inventory_group '${INVENTORY_GROUP}': must match ^[A-Za-z0-9_-]+$"
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # tag v5
        with:
          lfs: true
      # Pass inventory_group names (allowlisted above); CLI v1.3.2+ resolves them
      # to host-group UUIDs. Old UUID matrix path closed argv injection.
      # Plan title: when --name is omitted, deslicer change plan defaults to the
      # GitHub PR title (or push commit subject). Do not put PR titles in
      # command-args — change-action whitespace-splits them.
      - id: plan
        name: Create plan
        uses: deslicer/change-action@d78dd26a58f47d5f54c93f316eb3d6db02d2e75e
        with:
          command: plan
          command-args: --target-group ${{ matrix.inventory_group }} --environment ${{ matrix.environment }}
          observer-api-url: ${{ vars.OBSERVER_API_URL }}
          api-token: ${{ secrets.DESLICER_API_TOKEN }}
          github-token: ${{ github.token }}
